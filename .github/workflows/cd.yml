# ============================================================
# OIT MIS — Continuous Deployment (CD)
# ============================================================
# Triggers: Push to main branch only (not PRs)
# Steps:
#   1. Build Docker images
#   2. Push to GitHub Container Registry (ghcr.io)
#   3. SSH into production server and deploy
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST        — Server IP or hostname
#   DEPLOY_USER        — SSH username (e.g. ubuntu, root)
#   DEPLOY_SSH_KEY     — Private SSH key for the server
#   DEPLOY_PATH        — Project path on server (e.g. /opt/oit-mis)
# ============================================================

name: CD — Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/arab10-oss/orion-mis-backend
  FRONTEND_IMAGE: ghcr.io/arab10-oss/orion-mis-frontend

jobs:
  # ── Step 1: Build & Push Docker Images to GHCR ─────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & Push Backend ───────────────────────────────
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & Push Frontend ──────────────────────────────
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ── Step 2: Deploy to Production Server ────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ vars.DOMAIN || 'mis.oit.edu' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            echo "============================================"
            echo "  OIT MIS — Production Deployment"
            echo "  Commit: ${{ github.sha }}"
            echo "  Time:   $(date)"
            echo "============================================"

            cd ${{ secrets.DEPLOY_PATH || '/opt/oit-mis' }}

            # Pull latest code
            echo "► Pulling latest code..."
            git pull origin main

            # Login to GHCR
            echo "► Logging into container registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull pre-built images
            echo "► Pulling Docker images..."
            docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

            # Tag as latest for compose
            docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} orion-mis-backend:latest
            docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} orion-mis-frontend:latest

            # Database backup before deploy
            echo "► Pre-deploy database backup..."
            if [ -f scripts/backup-db.sh ]; then
              chmod +x scripts/backup-db.sh
              ./scripts/backup-db.sh || echo "⚠️ Backup skipped (non-critical)"
            fi

            # Deploy with production compose
            echo "► Deploying containers..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate backend frontend nginx

            # Health check
            echo "► Running health check..."
            sleep 10
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment successful! Health check passed."
            else
              echo "⚠️ Health check returned: $HTTP_CODE (backend may still be starting)"
            fi

            # Cleanup old images
            echo "► Cleaning up old Docker images..."
            docker image prune -f

            echo ""
            echo "============================================"
            echo "  ✅ Deployment Complete!"
            echo "============================================"

      - name: Deployment Summary
        run: |
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
